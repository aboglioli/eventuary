name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RDKAFKA_DEPS: cmake libssl-dev libcurl4-openssl-dev libsasl2-dev zlib1g-dev pkg-config

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install librdkafka build deps
        run: sudo apt-get update && sudo apt-get install -y $RDKAFKA_DEPS
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  umbrella-feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "memory"
          - "fs"
          - "sqlite"
          - "postgres"
          - "aws"
          - "kafka"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install librdkafka build deps
        if: contains(matrix.features, 'kafka')
        run: sudo apt-get update && sudo apt-get install -y $RDKAFKA_DEPS
      - name: cargo check -p eventuary --no-default-features --features '${{ matrix.features }}'
        run: cargo check -p eventuary --no-default-features --features "${{ matrix.features }}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install librdkafka build deps
        run: sudo apt-get update && sudo apt-get install -y $RDKAFKA_DEPS
      - name: Unit tests (no containers)
        run: cargo test --workspace --lib
      - name: Memory integration tests
        run: cargo test -p eventuary-memory
      - name: Filesystem integration tests
        run: cargo test -p eventuary-fs
      - name: SQLite integration tests
        run: cargo test -p eventuary-sqlite
      - name: Umbrella doctest (all features)
        run: cargo test -p eventuary --doc --all-features

  integration-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Postgres integration tests
        run: cargo test -p eventuary-postgres -- --test-threads=1

  integration-aws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: AWS integration tests (SQS + SNS, Floci via testcontainers)
        run: cargo test -p eventuary-aws -- --test-threads=1

  integration-kafka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install librdkafka build deps
        run: sudo apt-get update && sudo apt-get install -y $RDKAFKA_DEPS
      - name: Kafka integration tests (testcontainers)
        run: cargo test -p eventuary-kafka -- --test-threads=1
